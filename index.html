<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg-blur: 16px;
            --overlay-opacity: 0.65;
            --card-bg: rgba(18, 18, 24, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background & Overlay */
        .bg-container {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: background-image 0.5s ease;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, var(--overlay-opacity));
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            z-index: -1;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background: #09090b;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Container Layout */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            z-index: 1;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards ease 0.2s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Card Base */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* Main Profile Card */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        .avatar-wrapper {
            position: relative;
            width: 104px;
            height: 104px;
            margin-top: 4px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #121218;
        }

        .user-info .username {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .user-info .bio {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.45;
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 10px;
            margin: 2px 0 8px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px var(--accent-glow);
            border-color: transparent;
        }

        /* Music Player */
        .music-player {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .track-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .track-details {
            overflow: hidden;
            flex-grow: 1;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .playing-bars.active { opacity: 1; }

        .bar {
            width: 3px;
            background: var(--accent-color);
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { height: 2px; }
            100% { height: 12px; }
        }

        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.6875rem;
            color: var(--text-sub);
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .ctrl-btn:hover { color: var(--text-main); }
        .ctrl-btn:active { transform: scale(0.9); }

        .ctrl-btn.play-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 48px;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 3px;
        }

        /* Activity Card (Right Column) */
        .activity-card {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .section-title {
            font-size: 0.781rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i { color: var(--accent-color); }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .item-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .item-cover {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-details {
            overflow: hidden;
        }

        .item-name {
            font-size: 0.8125rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-sub {
            font-size: 0.72rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Activity Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 12px;
            border-left: 3px solid var(--accent-color);
        }

        .timeline-icon {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .timeline-content .act-text {
            font-size: 0.8125rem;
            font-weight: 500;
        }

        .timeline-content .act-time {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                max-width: 450px;
            }
        }
    </style>
</head>

                <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Recent Activity</div>

        </div>
    </div>
